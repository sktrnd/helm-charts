apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-role
rules:
- apiGroups: 
  - apps
  - storage.k8s.io
  - networking.k8s.io
  - policy
  resources: 
  - deployments
  - replicasets
  - ingresses
  - storageclasses
  - networkpolicies
  - poddisruptionbudgets
  - statefulsets
  verbs:
  - get
  - list
  - watch
  - create
  - updat
  - delete
- apiGroups:
  - ''
  resources:
  - configmaps
  - servicemonitors
  - podmonitors
  - secrets
  - serviceaccounts
  - services
  - persistentvolumeclaims
  verbs:
  - get
  - watch
  - list
  - create
  - delete
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  - podmonitors
  verbs:
  - get
  - create
  - delete
- apiGroups: 
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  - clusterrolebindings
  - roles
  - rolebindings
  verbs:
  - get
  - create
  - delete


